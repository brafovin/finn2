<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Auto Waschen Deluxe 3D</title>
<style>
  :root{ --bg0:#0a0d14; --ink:#e8f1ff; --accent:#48d1ff; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:radial-gradient(1200px 800px at 50% 30%,#1a2230,#06080d 70%);color:var(--ink);font-family:"Segoe UI",Roboto,Inter,system-ui,sans-serif;overflow:hidden}
  #app{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;gap:8px;padding:10px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 12px;background:linear-gradient(180deg,#141a26cc,#0c111a99);border:1px solid #1f2a3d;border-radius:12px;backdrop-filter:blur(8px)}
  header h1{font-size:18px;margin:0;letter-spacing:.5px}
  header h1 span{color:var(--accent)}
  .stats{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:14px}
  .pill{padding:4px 10px;border-radius:999px;background:#0d1320;border:1px solid #243149}
  .pill b{color:var(--accent)}
  #stage{position:relative;border-radius:18px;overflow:hidden;border:1px solid #1f2a3d;box-shadow:0 30px 80px #000a inset,0 10px 40px #0008}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:absolute;inset:0;pointer-events:none}
  #message{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:#0d1320d8;border:1px solid #2a3a55;padding:14px 22px;border-radius:14px;font-size:20px;letter-spacing:.4px;opacity:0;transition:opacity .35s;text-shadow:0 2px 16px #000c}
  #message.show{opacity:1}
  footer{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px;background:linear-gradient(180deg,#0c111a99,#141a26cc);border:1px solid #1f2a3d;border-radius:12px}
  .tool{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 14px;border-radius:12px;background:#0e1422;border:1px solid #1f2a3d;cursor:pointer;user-select:none;min-width:90px;transition:transform .12s,border-color .2s,background .2s}
  .tool:hover{transform:translateY(-2px);border-color:#365275}
  .tool.active{background:linear-gradient(180deg,#15273f,#0e1422);border-color:var(--accent);box-shadow:0 0 0 2px #48d1ff33,0 8px 24px #48d1ff22}
  .tool .ico{font-size:22px;line-height:1}
  .tool .lbl{font-size:12px;color:#bcd}
  .key{font-size:10px;color:#7fa;border:1px solid #2a3a55;padding:1px 5px;border-radius:6px;margin-left:4px}
  #next{margin-left:8px;padding:8px 14px;border-radius:12px;background:linear-gradient(180deg,#1a2e4d,#0e1422);border:1px solid #365275;color:#cfe9ff;cursor:pointer}
  #next:disabled{opacity:.4;cursor:not-allowed}
  .progress{position:absolute;left:14px;right:14px;bottom:14px;height:10px;border-radius:999px;background:#0d1320b0;border:1px solid #243149;overflow:hidden}
  .progress > div{height:100%;width:0%;background:linear-gradient(90deg,#48d1ff,#7fffd4);box-shadow:0 0 18px #48d1ff77;transition:width .15s}
  .legend{position:absolute;top:12px;left:14px;font-size:12px;color:#cfd8e8;background:#0d1320b0;border:1px solid #243149;padding:6px 10px;border-radius:10px;max-width:62%}
  .legend b{color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Auto <span>Waschen</span> Deluxe 3D</h1>
    <div class="stats">
      <div class="pill">Auftrag <b id="level">1</b></div>
      <div class="pill">Sauberkeit <b id="clean">0%</b></div>
      <div class="pill">Trinkgeld <b id="score">0&nbsp;€</b></div>
      <div class="pill">Zeit <b id="time">0.0s</b></div>
    </div>
  </header>

  <div id="stage">
    <canvas id="c"></canvas>
    <div id="hud">
      <div class="legend">1 Wasser · 2 Schaum · 3 Schwamm · 4 Trocknen · <b>Links</b> Reinigen · <b>Rechts/Zwei&nbsp;Finger</b> Kamera drehen · <b>Scrollen</b> Zoom</div>
      <div id="message"></div>
      <div class="progress"><div id="bar"></div></div>
    </div>
  </div>

  <footer>
    <div class="tool active" data-tool="water"><div class="ico">💦</div><div class="lbl">Wasser <span class="key">1</span></div></div>
    <div class="tool" data-tool="foam"><div class="ico">🫧</div><div class="lbl">Schaum <span class="key">2</span></div></div>
    <div class="tool" data-tool="sponge"><div class="ico">🧽</div><div class="lbl">Schwamm <span class="key">3</span></div></div>
    <div class="tool" data-tool="dry"><div class="ico">🌬️</div><div class="lbl">Trocknen <span class="key">4</span></div></div>
    <button id="next" disabled>Nächstes Auto →</button>
  </footer>
</div>

<script type="importmap">
{ "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
} }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ============================================================
//  Setup
// ============================================================
const stage = document.getElementById('stage');
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.55;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x171821);
scene.fog = new THREE.Fog(0x171821, 24, 75);

const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
camera.position.set(6.8, 3.6, 8.2);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 1.0, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 4.2;
controls.maxDistance = 18;
controls.maxPolarAngle = Math.PI * 0.49;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
controls.touches = { ONE: null, TWO: THREE.TOUCH.DOLLY_ROTATE };

function resize() {
  const r = stage.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / r.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

// ============================================================
//  Lights & environment
// ============================================================
scene.add(new THREE.HemisphereLight(0xd5e4ff, 0x4a4640, 1.1));
scene.add(new THREE.AmbientLight(0xffffff, 0.45));

const sun = new THREE.DirectionalLight(0xfff2d6, 2.0);
sun.position.set(7, 11, 5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8;  sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;    sun.shadow.camera.bottom = -8;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 30;
sun.shadow.bias = -0.0005;
scene.add(sun);

const rim = new THREE.DirectionalLight(0xa6ccff, 0.9);
rim.position.set(-6, 5, -6);
scene.add(rim);

const fill = new THREE.DirectionalLight(0xffffff, 0.7);
fill.position.set(0, 6, 10);
scene.add(fill);

// ============================================================
//  Workshop
// ============================================================
function buildWorkshop() {
  // --- Concrete floor ---
  const floor = new THREE.Mesh(
    new THREE.PlaneGeometry(34, 34),
    new THREE.MeshStandardMaterial({ color: 0x9aa0aa, roughness: 0.85, metalness: 0.05 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);

  // Subtle floor seams
  const seamMat = new THREE.MeshBasicMaterial({ color: 0x2a2d34, transparent: true, opacity: 0.55 });
  for (let i = -3; i <= 3; i++) {
    const s = new THREE.Mesh(new THREE.PlaneGeometry(34, 0.04), seamMat);
    s.rotation.x = -Math.PI/2;
    s.position.set(0, 0.011, i * 4);
    scene.add(s);
    const s2 = new THREE.Mesh(new THREE.PlaneGeometry(0.04, 34), seamMat);
    s2.rotation.x = -Math.PI/2;
    s2.position.set(i * 4, 0.011, 0);
    scene.add(s2);
  }

  // Yellow parking marking around the car
  const paintMat = new THREE.MeshBasicMaterial({ color: 0xf5c728 });
  function stripe(x, z, w, l, rot = 0) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), paintMat);
    m.rotation.x = -Math.PI/2; m.rotation.z = rot;
    m.position.set(x, 0.013, z);
    scene.add(m);
  }
  stripe(0,  3.6, 6.8, 0.10);
  stripe(0, -3.6, 6.8, 0.10);
  stripe(-3.4, 0, 0.10, 7.2);
  stripe( 3.4, 0, 0.10, 7.2);

  // --- Walls ---
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xc0c4ce, roughness: 0.92, metalness: 0.0 });
  const back = new THREE.Mesh(new THREE.PlaneGeometry(36, 13), wallMat);
  back.position.set(0, 6.0, -11);
  back.receiveShadow = true;
  scene.add(back);
  const left = new THREE.Mesh(new THREE.PlaneGeometry(22, 13), wallMat);
  left.position.set(-13, 6.0, 0);
  left.rotation.y = Math.PI/2;
  left.receiveShadow = true;
  scene.add(left);
  const right = new THREE.Mesh(new THREE.PlaneGeometry(22, 13), wallMat);
  right.position.set(13, 6.0, 0);
  right.rotation.y = -Math.PI/2;
  right.receiveShadow = true;
  scene.add(right);
  // Skirting board
  const skirtMat = new THREE.MeshStandardMaterial({ color: 0x33363f, roughness: 0.7 });
  const skirtB = new THREE.Mesh(new THREE.BoxGeometry(36, 0.35, 0.08), skirtMat);
  skirtB.position.set(0, 0.175, -10.96); scene.add(skirtB);
  const skirtL = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.35, 22), skirtMat);
  skirtL.position.set(-12.96, 0.175, 0); scene.add(skirtL);
  const skirtR = skirtL.clone(); skirtR.position.x = 12.96; scene.add(skirtR);

  // --- Roll-up garage door on back wall ---
  const doorMat = new THREE.MeshStandardMaterial({ color: 0x7e8590, roughness: 0.45, metalness: 0.55 });
  const door = new THREE.Mesh(new THREE.PlaneGeometry(8.2, 5.8), doorMat);
  door.position.set(0, 2.95, -10.94);
  scene.add(door);
  const slatMat = new THREE.MeshStandardMaterial({ color: 0x3a3f48, roughness: 0.7 });
  for (let i = 0; i < 9; i++) {
    const slat = new THREE.Mesh(new THREE.PlaneGeometry(8.2, 0.04), slatMat);
    slat.position.set(0, 0.3 + i * 0.66, -10.93);
    scene.add(slat);
  }
  // door rails
  const railMat = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.5, metalness: 0.7 });
  for (const sx of [-4.2, 4.2]) {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(0.12, 5.9, 0.08), railMat);
    rail.position.set(sx, 2.95, -10.92);
    scene.add(rail);
  }

  // --- Ceiling beams ---
  const beamMat = new THREE.MeshStandardMaterial({ color: 0x2c303a, roughness: 0.55, metalness: 0.55 });
  for (let i = -3; i <= 3; i++) {
    const beam = new THREE.Mesh(new THREE.BoxGeometry(26, 0.32, 0.32), beamMat);
    beam.position.set(0, 7.6, i * 1.8);
    scene.add(beam);
  }
  // Crossbeams
  for (const cx of [-10, -5, 0, 5, 10]) {
    const cb = new THREE.Mesh(new THREE.BoxGeometry(0.32, 0.32, 13), beamMat);
    cb.position.set(cx, 7.85, 0);
    scene.add(cb);
  }

  // --- Hanging workshop lamps ---
  const lampShadeMat = new THREE.MeshStandardMaterial({ color: 0xe8d9a8, roughness: 0.55, side: THREE.DoubleSide });
  function lamp(x, z, intensity = 12) {
    const wire = new THREE.Mesh(new THREE.CylinderGeometry(0.015, 0.015, 1.4),
      new THREE.MeshBasicMaterial({ color: 0x222 }));
    wire.position.set(x, 7.0, z);
    scene.add(wire);
    const cone = new THREE.Mesh(new THREE.ConeGeometry(0.48, 0.45, 18, 1, true), lampShadeMat);
    cone.position.set(x, 6.25, z);
    scene.add(cone);
    const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 10),
      new THREE.MeshBasicMaterial({ color: 0xffe7b8 }));
    bulb.position.set(x, 6.10, z);
    scene.add(bulb);
    const pl = new THREE.PointLight(0xffe4b0, intensity, 14, 1.4);
    pl.position.set(x, 5.95, z);
    scene.add(pl);
  }
  lamp(-3, 0); lamp(3, 0); lamp(0, -3); lamp(0, 3);

  // --- Workbench (left side) ---
  const benchMat = new THREE.MeshStandardMaterial({ color: 0x6a3b1f, roughness: 0.75 });
  const benchFrame = new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.6, metalness: 0.55 });
  const benchTop = new THREE.Mesh(new THREE.BoxGeometry(7, 0.16, 1.4), benchMat);
  benchTop.position.set(-9.8, 1.1, -6);
  benchTop.castShadow = true; benchTop.receiveShadow = true;
  scene.add(benchTop);
  for (const lx of [-13, -6.6]) {
    for (const lz of [-6.55, -5.45]) {
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.12, 1.1, 0.12), benchFrame);
      leg.position.set(lx, 0.55, lz);
      leg.castShadow = true;
      scene.add(leg);
    }
  }
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(6.4, 0.06, 1.2),
    new THREE.MeshStandardMaterial({ color: 0x4f2c14, roughness: 0.85 }));
  shelf.position.set(-9.8, 0.35, -6);
  scene.add(shelf);
  // Vise on bench
  const viseBody = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.3, 0.3),
    new THREE.MeshStandardMaterial({ color: 0x2a4ec5, roughness: 0.45, metalness: 0.6 }));
  viseBody.position.set(-7.3, 1.33, -6);
  scene.add(viseBody);
  const viseJaw = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.32, 0.45),
    new THREE.MeshStandardMaterial({ color: 0x9aa3b0, roughness: 0.4, metalness: 0.8 }));
  viseJaw.position.set(-7.55, 1.34, -6);
  scene.add(viseJaw);

  // --- Pegboard with tools ---
  const peg = new THREE.Mesh(new THREE.BoxGeometry(6, 2.4, 0.06),
    new THREE.MeshStandardMaterial({ color: 0xc24a1a, roughness: 0.7 }));
  peg.position.set(-9.8, 3.5, -6.69);
  scene.add(peg);
  const metalMat = new THREE.MeshStandardMaterial({ color: 0xc0c6d2, roughness: 0.3, metalness: 0.85 });
  const handleMat = new THREE.MeshStandardMaterial({ color: 0x6a3b1f, roughness: 0.85 });
  function pegItem(geo, mat, x, y, rot = 0) {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(-9.8 + x, 3.5 + y, -6.65);
    m.rotation.z = rot;
    scene.add(m);
  }
  // wrenches
  pegItem(new THREE.PlaneGeometry(0.18, 1.4), metalMat, -2.2, 0.2);
  pegItem(new THREE.PlaneGeometry(0.16, 1.2), metalMat, -1.7, 0.1);
  pegItem(new THREE.PlaneGeometry(0.14, 1.0), metalMat, -1.2, 0.0);
  pegItem(new THREE.RingGeometry(0.16, 0.24, 18), metalMat, -2.2, 0.95);
  pegItem(new THREE.RingGeometry(0.14, 0.22, 18), metalMat, -1.7, 0.75);
  // hammer
  pegItem(new THREE.PlaneGeometry(0.07, 1.0), handleMat, -0.4, 0.0);
  pegItem(new THREE.PlaneGeometry(0.42, 0.18), metalMat, -0.4, 0.55);
  // screwdrivers
  for (let i = 0; i < 4; i++) {
    pegItem(new THREE.PlaneGeometry(0.05, 0.8), metalMat, 0.4 + i*0.18, 0.1);
    pegItem(new THREE.PlaneGeometry(0.10, 0.25), handleMat, 0.4 + i*0.18, -0.35);
  }
  // saw
  pegItem(new THREE.PlaneGeometry(1.2, 0.22), metalMat, 2.0, 0.7);
  pegItem(new THREE.PlaneGeometry(0.35, 0.12), handleMat, 1.3, 0.7);

  // --- Tire stack (right rear) ---
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x0d1018, roughness: 0.95, metalness: 0.05 });
  for (let s = 0; s < 4; s++) {
    const tire = new THREE.Mesh(new THREE.TorusGeometry(0.48, 0.18, 14, 30), tireMat);
    tire.rotation.x = Math.PI/2;
    tire.position.set(8.8, 0.20 + s * 0.34, -7);
    tire.castShadow = true; tire.receiveShadow = true;
    scene.add(tire);
  }

  // --- Oil drums ---
  function drum(x, z, color) {
    const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.45, 26),
      new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.55 }));
    body.position.set(x, 0.725, z);
    body.castShadow = true; body.receiveShadow = true;
    scene.add(body);
    const bandMat = new THREE.MeshStandardMaterial({ color: 0x3b414e, roughness: 0.5, metalness: 0.7 });
    for (const by of [-0.45, 0.45]) {
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.462, 0.462, 0.08, 26), bandMat);
      band.position.set(x, 0.725 + by, z);
      scene.add(band);
    }
    const lid = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.44, 0.05, 26),
      new THREE.MeshStandardMaterial({ color: 0x2a2f3a, roughness: 0.45, metalness: 0.7 }));
    lid.position.set(x, 1.47, z);
    scene.add(lid);
  }
  drum( 9.6, -4.2, 0xc02a1a);
  drum(10.4, -5.1, 0x1c52c5);
  drum( 9.6, -6.0, 0xc59c1a);

  // --- Tool cart (red cabinet) ---
  const cartMat = new THREE.MeshStandardMaterial({ color: 0xc02828, roughness: 0.4, metalness: 0.55 });
  const cart = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.7, 0.95), cartMat);
  cart.position.set(8.6, 0.85, 5);
  cart.castShadow = true; cart.receiveShadow = true;
  scene.add(cart);
  const drawerLineMat = new THREE.MeshStandardMaterial({ color: 0x500a0a });
  const drawHandleMat = new THREE.MeshStandardMaterial({ color: 0xd0d3da, roughness: 0.25, metalness: 0.85 });
  for (let d = 0; d < 4; d++) {
    const line = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.025, 0.96), drawerLineMat);
    line.position.set(8.6, 0.22 + d * 0.4, 5);
    scene.add(line);
    const h = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.045, 0.05), drawHandleMat);
    h.position.set(8.6, 0.40 + d * 0.4, 5.49);
    scene.add(h);
  }
  // Toolbox lid (top compartment)
  const topLid = new THREE.Mesh(new THREE.BoxGeometry(1.52, 0.05, 0.97),
    new THREE.MeshStandardMaterial({ color: 0x900, roughness: 0.4, metalness: 0.4 }));
  topLid.position.set(8.6, 1.72, 5);
  scene.add(topLid);

  // --- Stacked boxes (back left) ---
  const boxMat1 = new THREE.MeshStandardMaterial({ color: 0xa6743a, roughness: 0.9 });
  const boxMat2 = new THREE.MeshStandardMaterial({ color: 0x8c5e2c, roughness: 0.9 });
  function box(x, y, z, sx, sy, sz, m) {
    const b = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), m);
    b.position.set(x, y, z);
    b.castShadow = true; b.receiveShadow = true;
    scene.add(b);
  }
  box(-9, 0.5, 4, 1.0, 1.0, 1.0, boxMat1);
  box(-9.7, 0.4, 5.1, 0.8, 0.8, 0.8, boxMat2);
  box(-8.4, 0.4, 4.9, 0.8, 0.8, 0.8, boxMat1);
  box(-9.1, 1.4, 4.3, 0.8, 0.8, 0.8, boxMat2);

  // --- "WERKSTATT" sign above back wall door ---
  const signCanvas = document.createElement('canvas');
  signCanvas.width = 512; signCanvas.height = 96;
  const sctx = signCanvas.getContext('2d');
  sctx.fillStyle = '#1a1c22'; sctx.fillRect(0, 0, 512, 96);
  sctx.strokeStyle = '#f5c728'; sctx.lineWidth = 6;
  sctx.strokeRect(6, 6, 500, 84);
  sctx.fillStyle = '#f5c728';
  sctx.font = 'bold 56px Impact, "Arial Black", sans-serif';
  sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
  sctx.fillText('WERKSTATT', 256, 52);
  const signTex = new THREE.CanvasTexture(signCanvas);
  signTex.colorSpace = THREE.SRGBColorSpace;
  const sign = new THREE.Mesh(
    new THREE.PlaneGeometry(5, 0.9),
    new THREE.MeshBasicMaterial({ map: signTex })
  );
  sign.position.set(0, 6.4, -10.93);
  scene.add(sign);
}
buildWorkshop();

// ============================================================
//  Game state
// ============================================================
const game = {
  tool: 'water',
  paintIdx: 0,
  palette: [0xd9314a, 0x2566f0, 0x15a36a, 0xeea024, 0x8b3aa6, 0x1a212c, 0xdadce3, 0x0aa8b8],
  level: 1, score: 0, elapsed: 0,
  cleanliness: 0, wetness: 0, dryness: 1, foamCount: 0,
  finished: false,
  dirtMeshes: [],
  carGroup: null,
};

const ui = {
  level: document.getElementById('level'),
  clean: document.getElementById('clean'),
  score: document.getElementById('score'),
  time:  document.getElementById('time'),
  bar:   document.getElementById('bar'),
  msg:   document.getElementById('message'),
  next:  document.getElementById('next'),
};
function showMessage(text, ms = 2400) {
  ui.msg.textContent = text;
  ui.msg.classList.add('show');
  clearTimeout(showMessage._t);
  showMessage._t = setTimeout(() => ui.msg.classList.remove('show'), ms);
}

// ============================================================
//  Dirt texture + material (paint shader injection)
// ============================================================
function makeDirtTexture() {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.clearRect(0, 0, c.width, c.height);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  tex.flipY = false;
  return { canvas: c, ctx, texture: tex };
}

function remapBoxFaceUVs(geo) {
  // BoxGeometry face order: +x, -x, +y, -y, +z, -z.
  // Lay out 3x2 in the dirt canvas, normalized 0..1.
  const regions = [
    [0/3, 0/2, 1/3, 1/2], [1/3, 0/2, 1/3, 1/2], [2/3, 0/2, 1/3, 1/2],
    [0/3, 1/2, 1/3, 1/2], [1/3, 1/2, 1/3, 1/2], [2/3, 1/2, 1/3, 1/2],
  ];
  const arr = geo.attributes.uv.array;
  for (let f = 0; f < 6; f++) {
    const [u0, v0, uw, vh] = regions[f];
    const i = f * 8;
    arr[i+0]=u0;        arr[i+1]=v0+vh;
    arr[i+2]=u0+uw;     arr[i+3]=v0+vh;
    arr[i+4]=u0;        arr[i+5]=v0;
    arr[i+6]=u0+uw;     arr[i+7]=v0;
  }
  geo.attributes.uv.needsUpdate = true;
}

function sprinkleDirt(dirt, intensity = 1) {
  const { ctx, canvas: dc, texture } = dirt;
  ctx.clearRect(0, 0, dc.width, dc.height);
  const fw = dc.width / 3, fh = dc.height / 2;
  for (let fy = 0; fy < 2; fy++) {
    for (let fx = 0; fx < 3; fx++) {
      // Skip "bottom" face (index 3 == -y == fy=1, fx=0)
      if (fx === 0 && fy === 1) continue;
      const x0 = fx * fw, y0 = fy * fh;
      const blobs = Math.floor(38 * intensity);
      for (let i = 0; i < blobs; i++) {
        const cx = x0 + Math.random() * fw;
        const cy = y0 + Math.random() * fh;
        const r = 14 + Math.random() * 46;
        const hue = 22 + Math.random() * 18;
        const a = 0.55 + Math.random() * 0.35;
        const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
        g.addColorStop(0, `hsla(${hue},45%,14%,${a})`);
        g.addColorStop(0.55, `hsla(${hue},35%,12%,${a*0.45})`);
        g.addColorStop(1, `hsla(${hue},30%,10%,0)`);
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
      }
      for (let i = 0; i < Math.floor(10 * intensity); i++) {
        const sx = x0 + Math.random() * fw;
        const sy = y0 + Math.random() * fh;
        ctx.strokeStyle = `hsla(${24+Math.random()*16},40%,12%,${0.3+Math.random()*0.3})`;
        ctx.lineWidth = 2 + Math.random()*4;
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.bezierCurveTo(sx+18, sy+12, sx+34, sy-6, sx+55, sy + (Math.random()-0.5)*22);
        ctx.stroke();
      }
    }
  }
  texture.needsUpdate = true;
}

function makeCarMaterial(color, dirtTex) {
  const mat = new THREE.MeshPhysicalMaterial({
    color,
    metalness: 0.78,
    roughness: 0.32,
    clearcoat: 1.0,
    clearcoatRoughness: 0.18,
  });
  // Use map slot so vMapUv is computed automatically, then override the chunk.
  mat.map = dirtTex;
  mat.onBeforeCompile = (shader) => {
    shader.uniforms.uWetness = { value: 0 };
    shader.fragmentShader = shader.fragmentShader
      .replace('#include <common>',
        `#include <common>
         uniform float uWetness;`)
      .replace('#include <map_fragment>',
        `vec4 dirtSample = texture2D( map, vMapUv );
         float dirtA = dirtSample.a;
         diffuseColor.rgb = mix( diffuseColor.rgb, vec3(0.12, 0.085, 0.045), dirtA * 0.94 );`)
      .replace('#include <roughnessmap_fragment>',
        `float roughnessFactor = roughness;
         #ifdef USE_ROUGHNESSMAP
           vec4 texelRoughness = texture2D( roughnessMap, vRoughnessMapUv );
           roughnessFactor *= texelRoughness.g;
         #endif
         float dirtR = texture2D( map, vMapUv ).a;
         roughnessFactor = mix( roughnessFactor, 0.85, dirtR );
         roughnessFactor = mix( roughnessFactor, 0.05, (1.0 - dirtR) * uWetness );`);
    mat.userData.shader = shader;
  };
  return mat;
}

function buildCar() {
  // Tear down previous
  if (game.carGroup) {
    scene.remove(game.carGroup);
    game.carGroup.traverse(o => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) {
        if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
        else o.material.dispose();
      }
    });
  }
  game.dirtMeshes = [];

  const group = new THREE.Group();
  group.position.set(0, 0, 0);
  scene.add(group);
  game.carGroup = group;

  const color = game.palette[game.paintIdx % game.palette.length];

  const bodyW = 4.2, bodyH = 1.0, bodyD = 1.85;
  const cabinW = 2.4, cabinH = 0.78, cabinD = 1.72;

  // Lower body
  const bodyGeo = new THREE.BoxGeometry(bodyW, bodyH, bodyD, 1, 1, 1);
  remapBoxFaceUVs(bodyGeo);
  const bodyDirt = makeDirtTexture();
  const bodyMat = makeCarMaterial(color, bodyDirt.texture);
  const body = new THREE.Mesh(bodyGeo, bodyMat);
  body.position.y = 0.7;
  body.castShadow = true; body.receiveShadow = true;
  body.userData.dirt = bodyDirt;
  group.add(body);
  game.dirtMeshes.push(body);

  // Cabin (greenhouse)
  const cabinGeo = new THREE.BoxGeometry(cabinW, cabinH, cabinD, 1, 1, 1);
  remapBoxFaceUVs(cabinGeo);
  const cabinDirt = makeDirtTexture();
  const cabinMat = makeCarMaterial(color, cabinDirt.texture);
  const cabin = new THREE.Mesh(cabinGeo, cabinMat);
  cabin.position.set(-0.15, 0.7 + bodyH/2 + cabinH/2 - 0.02, 0);
  cabin.castShadow = true; cabin.receiveShadow = true;
  cabin.userData.dirt = cabinDirt;
  group.add(cabin);
  game.dirtMeshes.push(cabin);

  // Windows (transparent panes inset on cabin faces)
  const winMat = new THREE.MeshPhysicalMaterial({
    color: 0x1a2838, metalness: 0.1, roughness: 0.08,
    transmission: 0.85, transparent: true, opacity: 0.45,
    ior: 1.45, clearcoat: 1, clearcoatRoughness: 0.05
  });
  function addPane(w, h, x, y, z, ry = 0) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), winMat);
    m.position.set(x, y, z); m.rotation.y = ry;
    group.add(m);
  }
  const cy = cabin.position.y + 0.04;
  addPane(cabinW * 0.92, cabinH * 0.62, cabin.position.x, cy,  cabinD/2 + 0.001);
  addPane(cabinW * 0.92, cabinH * 0.62, cabin.position.x, cy, -cabinD/2 - 0.001, Math.PI);
  addPane(cabinD * 0.92, cabinH * 0.62, cabin.position.x + cabinW/2 + 0.001, cy, 0,  Math.PI/2);
  addPane(cabinD * 0.92, cabinH * 0.62, cabin.position.x - cabinW/2 - 0.001, cy, 0, -Math.PI/2);

  // Wheels with rim spokes
  const tireMat = new THREE.MeshStandardMaterial({ color: 0x0b0e15, roughness: 0.95, metalness: 0.05 });
  const rimMat  = new THREE.MeshStandardMaterial({ color: 0xc6cdd9, roughness: 0.18, metalness: 0.95 });
  const hubMat  = new THREE.MeshStandardMaterial({ color: 0x2a3344, roughness: 0.4, metalness: 0.8 });
  const wheelPositions = [
    [-bodyW/2 + 0.8, 0.46,  bodyD/2 + 0.18],
    [ bodyW/2 - 0.8, 0.46,  bodyD/2 + 0.18],
    [-bodyW/2 + 0.8, 0.46, -bodyD/2 - 0.18],
    [ bodyW/2 - 0.8, 0.46, -bodyD/2 - 0.18],
  ];
  for (const [x, y, z] of wheelPositions) {
    const tire = new THREE.Mesh(new THREE.CylinderGeometry(0.46, 0.46, 0.32, 28), tireMat);
    tire.rotation.x = Math.PI/2;
    tire.position.set(x, y, z);
    tire.castShadow = true;
    group.add(tire);
    const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.34, 20), rimMat);
    rim.rotation.x = Math.PI/2;
    rim.position.set(x, y, z);
    group.add(rim);
    for (let s = 0; s < 5; s++) {
      const a = s / 5 * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.36, 0.18), rimMat);
      spoke.position.set(x, y, z);
      spoke.rotation.x = Math.PI/2;
      spoke.rotation.y = a;
      spoke.translateY(0.16);
      group.add(spoke);
    }
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.36, 16), hubMat);
    hub.rotation.x = Math.PI/2;
    hub.position.set(x, y, z);
    group.add(hub);
  }

  // Head- and taillights
  const head = new THREE.MeshStandardMaterial({ color: 0xfff8d8, emissive: 0xfff0a8, emissiveIntensity: 1.4, roughness: 0.2 });
  const tail = new THREE.MeshStandardMaterial({ color: 0x300, emissive: 0xff2222, emissiveIntensity: 0.9, roughness: 0.4 });
  function lamp(mat, x, y, z) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.16, 18, 14), mat);
    m.position.set(x, y, z);
    group.add(m);
  }
  lamp(head,  bodyW/2 + 0.01, 0.85,  bodyD/2 - 0.35);
  lamp(head,  bodyW/2 + 0.01, 0.85, -bodyD/2 + 0.35);
  lamp(tail, -bodyW/2 - 0.01, 0.85,  bodyD/2 - 0.35);
  lamp(tail, -bodyW/2 - 0.01, 0.85, -bodyD/2 + 0.35);

  const beam1 = new THREE.PointLight(0xfff0a0, 2.2, 6, 2);
  beam1.position.set(bodyW/2 + 0.6, 0.85, bodyD/2 - 0.35);
  group.add(beam1);
  const beam2 = new THREE.PointLight(0xfff0a0, 2.2, 6, 2);
  beam2.position.set(bodyW/2 + 0.6, 0.85, -bodyD/2 + 0.35);
  group.add(beam2);

  // License plate strip (cosmetic)
  const plate = new THREE.Mesh(
    new THREE.PlaneGeometry(0.8, 0.18),
    new THREE.MeshStandardMaterial({ color: 0xf6f0c2, emissive: 0x252010, emissiveIntensity: 0.2 })
  );
  plate.position.set(-bodyW/2 - 0.001, 0.55, 0);
  plate.rotation.y = -Math.PI/2;
  group.add(plate);

  // Seed dirt
  sprinkleDirt(bodyDirt, 1 + (game.level-1) * 0.18);
  sprinkleDirt(cabinDirt, 1 + (game.level-1) * 0.18);
}

function makePoolPoints(maxCount, opts) {
  const geo = new THREE.BufferGeometry();
  const positions = new Float32Array(maxCount * 3);
  const sizes = new Float32Array(maxCount);
  const alphas = new Float32Array(maxCount);
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(sizes, 1));
  geo.setAttribute('aAlpha', new THREE.BufferAttribute(alphas, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(opts.color) },
      uColor2:{ value: new THREE.Color(opts.color2 || opts.color) },
      uHighlight: { value: opts.highlight ? 1 : 0 },
      uPixelRatio: { value: renderer.getPixelRatio() }
    },
    vertexShader: `
      attribute float aSize;
      attribute float aAlpha;
      varying float vAlpha;
      uniform float uPixelRatio;
      void main(){
        vAlpha = aAlpha;
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = aSize * uPixelRatio * (300.0 / -mv.z);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform vec3 uColor2;
      uniform float uHighlight;
      varying float vAlpha;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        float d = length(uv);
        if (d > 0.5) discard;
        float core = smoothstep(0.5, 0.0, d);
        vec3 col = mix(uColor2, uColor, core);
        float hl = smoothstep(0.18, 0.05, length(uv + vec2(-0.18, -0.20))) * uHighlight;
        col = mix(col, vec3(1.0), hl * 0.85);
        gl_FragColor = vec4(col, vAlpha * core);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.NormalBlending,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return {
    points, max: maxCount, count: 0,
    pos: positions, size: sizes, alpha: alphas,
    states: new Array(maxCount).fill(null),
    spawn(state) {
      const i = this.count < this.max ? this.count++ : (Math.random() * this.max) | 0;
      this.states[i] = state;
      this.pos[i*3+0] = state.x; this.pos[i*3+1] = state.y; this.pos[i*3+2] = state.z;
      this.size[i] = state.size;
      this.alpha[i] = state.alpha;
      geo.attributes.position.needsUpdate = true;
      geo.attributes.aSize.needsUpdate = true;
      geo.attributes.aAlpha.needsUpdate = true;
    },
    update(dt) {
      const g = 9.8 * dt;
      let alive = 0;
      for (let i = 0; i < this.count; i++) {
        const s = this.states[i];
        if (!s) continue;
        s.life -= dt;
        if (s.life <= 0) { this.states[i] = null; this.alpha[i] = 0; continue; }
        s.vy -= (s.gravity || 0) * dt * 60 * 0.0005 + (s.gravity || 0) * dt;
        s.x += s.vx * dt;
        s.y += s.vy * dt;
        s.z += s.vz * dt;
        if (s.y < 0.01) { s.life = 0; this.alpha[i] = 0; continue; }
        const t = s.life / s.maxLife;
        this.pos[i*3+0] = s.x;
        this.pos[i*3+1] = s.y;
        this.pos[i*3+2] = s.z;
        this.alpha[i] = s.alpha * Math.min(1, t * 2);
        alive++;
      }
      geo.attributes.position.needsUpdate = true;
      geo.attributes.aAlpha.needsUpdate = true;
      // initialize unused entries to size 0
    },
  };
}

const water = makePoolPoints(400, { color: 0xcde9ff, color2: 0x5ea9d6, highlight: true });
const foam  = makePoolPoints(500, { color: 0xffffff, color2: 0xc8e0f0, highlight: true });

  for (let i = 0; i < 22; i++) {

}

// ============================================================
//  Painting / raycaster
// ============================================================
const raycaster = new THREE.Raycaster();
const ndc = new THREE.Vector2();
const pointer = { down: false, hitPoint: new THREE.Vector3(), hitUV: null, hitMesh: null, lastUv: new Map() };

function setNdc(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  ndc.x = ((t.clientX - r.left) / r.width) * 2 - 1;
  ndc.y = -((t.clientY - r.top) / r.height) * 2 + 1;
}
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  if (e.pointerType === 'touch' && e.isPrimary !== true) return;
  canvas.setPointerCapture(e.pointerId);
  setNdc(e);
  pointer.down = true;
  doRaycast();
  applyToolAtHit();
});
canvas.addEventListener('pointermove', e => {
  setNdc(e);
  if (pointer.down) {
    doRaycast();
    applyToolAtHit();
  }
});
['pointerup','pointercancel','pointerleave'].forEach(ev =>
  canvas.addEventListener(ev, () => { pointer.down = false; pointer.lastUv.clear(); }));

function doRaycast() {
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObjects(game.dirtMeshes, false);
  if (hits.length) {
    pointer.hitPoint.copy(hits[0].point);
    pointer.hitUV = hits[0].uv;
    pointer.hitMesh = hits[0].object;
  } else {
    pointer.hitUV = null;
    pointer.hitMesh = null;
  }
}

function erase(ctx, x, y, r, power) {
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${power})`);
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}
function eraseSegment(ctx, ax, ay, bx, by, r, power) {
  // Quick line between last and current hit
  ctx.save();
  ctx.globalCompositeOperation = 'destination-out';
  ctx.lineCap = 'round';
  ctx.lineWidth = r * 1.6;
  ctx.strokeStyle = `rgba(0,0,0,${power})`;
  ctx.beginPath();
  ctx.moveTo(ax, ay); ctx.lineTo(bx, by);
  ctx.stroke();
  ctx.restore();
}

let lastSpawnAt = 0;
function applyToolAtHit() {
  if (!pointer.hitUV || !pointer.hitMesh) {
    pointer.lastUv.clear();
    return;
  }
  const mesh = pointer.hitMesh;
  const dirt = mesh.userData.dirt;
  const dc = dirt.canvas;
  const px = pointer.hitUV.x * dc.width;
  const py = pointer.hitUV.y * dc.height;
  const wp = pointer.hitPoint;

  const now = performance.now();
  const canSpawn = now - lastSpawnAt > 60;

  if (game.tool === 'water') {
    erase(dirt.ctx, px, py, 34, 0.75);
    const last = pointer.lastUv.get(mesh.uuid);
    if (last) eraseSegment(dirt.ctx, last.x, last.y, px, py, 30, 0.7);
    pointer.lastUv.set(mesh.uuid, { x: px, y: py });
    dirt.texture.needsUpdate = true;
    if (canSpawn) { spawnWater(wp); lastSpawnAt = now; }
    game.wetness = Math.min(1, game.wetness + 0.05);
    game.dryness = Math.max(0, game.dryness - 0.05);
  } else if (game.tool === 'sponge') {
    const foamHere = foamNear(wp, 0.6);
    const power = foamHere ? 1.0 : 0.92;
    const r = 42;
    erase(dirt.ctx, px, py, r, power);
    const last = pointer.lastUv.get(mesh.uuid);
    if (last) eraseSegment(dirt.ctx, last.x, last.y, px, py, r * 0.8, power);
    pointer.lastUv.set(mesh.uuid, { x: px, y: py });
    dirt.texture.needsUpdate = true;
    consumeFoamNear(wp, 0.6);
  } else if (game.tool === 'foam') {
    if (canSpawn) { spawnFoam(wp); lastSpawnAt = now; }
    erase(dirt.ctx, px, py, 22, 0.35);
    dirt.texture.needsUpdate = true;
  } else if (game.tool === 'dry') {
    if (canSpawn) { spawnWind(wp); lastSpawnAt = now; }
    game.dryness = Math.min(1, game.dryness + 0.025);
    game.wetness = Math.max(0, game.wetness - 0.025);
    dryFoamNear(wp, 0.6);
  }
}

// ============================================================
//  Particle emitters / queries
// ============================================================
function spawnWater(wp) {
  for (let i = 0; i < 3; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 0.6 + Math.random() * 1.4;
    water.spawn({
      x: wp.x, y: wp.y + 0.05, z: wp.z,
      vx: Math.cos(a) * sp,
      vy: 0.8 + Math.random() * 1.2,
      vz: Math.sin(a) * sp,
      gravity: 9.5,
      size: 10 + Math.random() * 10,
      alpha: 0.7,
      life: 0.25 + Math.random() * 0.25,
      maxLife: 0.5,
    });
  }
}
function spawnFoam(wp) {
  for (let i = 0; i < 2; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.random() * 0.18;
    foam.spawn({
      x: wp.x + Math.cos(a)*r,
      y: wp.y + Math.random()*0.06,
      z: wp.z + Math.sin(a)*r,
      vx: Math.cos(a) * 0.12,
      vy: 0.0,
      vz: Math.sin(a) * 0.12,
      gravity: 0.0,
      size: 16 + Math.random() * 12,
      alpha: 0.55,
      life: 0.9 + Math.random() * 0.8,
      maxLife: 1.7,
    });
  }
  game.foamCount += 2;
}
function spawnWind(wp) {
  const dir = new THREE.Vector3().subVectors(wp, camera.position).setY(0).normalize();
  for (let i = 0; i < 2; i++) {
    const o = new THREE.Vector3(
      (Math.random()-0.5)*0.18, (Math.random()-0.5)*0.12, (Math.random()-0.5)*0.18
    );
    wind.spawn({
      x: wp.x + o.x, y: wp.y + o.y, z: wp.z + o.z,
      vx: dir.x * 3 + (Math.random()-0.5)*0.8,
      vy: 0.25 + Math.random()*0.4,
      vz: dir.z * 3 + (Math.random()-0.5)*0.8,
      gravity: 0,
      size: 12 + Math.random()*6,
      alpha: 0.35,
      life: 0.18 + Math.random()*0.18,
      maxLife: 0.36,
    });
  }
}
function foamNear(wp, r) {
  const r2 = r*r;
  for (let i = 0; i < foam.count; i++) {
    const s = foam.states[i];
    if (!s) continue;
    const dx = s.x - wp.x, dy = s.y - wp.y, dz = s.z - wp.z;
    if (dx*dx + dy*dy + dz*dz < r2) return true;
  }
  return false;
}
function consumeFoamNear(wp, r) {
  const r2 = r*r;
  for (let i = 0; i < foam.count; i++) {
    const s = foam.states[i];
    if (!s) continue;
    const dx = s.x - wp.x, dy = s.y - wp.y, dz = s.z - wp.z;
    if (dx*dx + dy*dy + dz*dz < r2) s.life -= 0.4;
  }
}
function dryFoamNear(wp, r) {
  const r2 = r*r;
  for (let i = 0; i < foam.count; i++) {
    const s = foam.states[i];
    if (!s) continue;
    const dx = s.x - wp.x, dy = s.y - wp.y, dz = s.z - wp.z;
    if (dx*dx + dy*dy + dz*dz < r2) s.life -= 0.25;
  }
}

// ============================================================
//  Cleanliness sampling
// ============================================================
let sampleAccum = 0;
function measureCleanliness() {
  let total = 0, dirty = 0;
  for (const m of game.dirtMeshes) {
    const { ctx, canvas: dc } = m.userData.dirt;
    const w = dc.width, h = dc.height;
    // Sample 5/6 of the canvas regions (skip the bottom face).
    const img = ctx.getImageData(0, 0, w, h).data;
    const step = 10;
    for (let y = 0; y < h; y += step) {
      const fy = Math.floor(y / (h/2));
      for (let x = 0; x < w; x += step) {
        const fx = Math.floor(x / (w/3));
        if (fx === 0 && fy === 1) continue; // skip "bottom" region
        const idx = (y * w + x) * 4 + 3;
        total++;
        if (img[idx] > 14) dirty++;
      }
    }
  }
  return total ? 1 - dirty / total : 1;
}

// ============================================================
//  Level / scoring
// ============================================================
function newLevel() {
  game.finished = false;
  ui.next.disabled = true;
  game.elapsed = 0;
  game.wetness = 0;
  game.dryness = 1;
  game.cleanliness = 0;
  game.foamCount = 0;
  buildCar();
  rebuildSparkles();
  ui.level.textContent = game.level;
  ui.score.textContent = game.score + ' €';
  showMessage(`Auftrag ${game.level}: schrubb den Wagen blitzblank!`);
}
function finishLevel() {
  game.finished = true;
  const timeBonus = Math.max(0, 120 - Math.floor(game.elapsed * 0.4));
  const cleanBonus = Math.floor(game.cleanliness * 220);
  const dryBonus = Math.floor(game.dryness * 60);
  const tip = Math.max(20, cleanBonus + timeBonus + dryBonus);
  game.score += tip;
  ui.score.textContent = game.score + ' €';
  showMessage(`✨ Glänzend! +${tip} € Trinkgeld`);
  ui.next.disabled = false;
}
ui.next.addEventListener('click', () => {
  game.level++;
  game.paintIdx = (game.paintIdx + 1) % game.palette.length;
  newLevel();
});

// ============================================================
//  Render loop
// ============================================================
let last = performance.now();
function loop(t) {
  const dtRaw = (t - last) / 1000;
  const dt = Math.min(0.05, dtRaw);
  last = t;

  if (!game.finished) game.elapsed += dt;
  ui.time.textContent = game.elapsed.toFixed(1) + 's';

  // Update wetness uniform for both car materials
  const targetWet = game.wetness;
  for (const m of game.dirtMeshes) {
    const sh = m.material.userData.shader;
    if (sh) sh.uniforms.uWetness.value = targetWet;
  }
  // passive drying
  game.dryness = Math.min(1, game.dryness + 0.06 * dt);
  game.wetness = Math.max(0, game.wetness - 0.04 * dt);

  // Particles
  water.update(dt);
  foam.update(dt);
  wind.update(dt);

  // Sparkles visible only when clean & dry
  const shine = (game.cleanliness > 0.9 && game.dryness > 0.75) ? 1 : 0;
  sparkleGroup.children.forEach((m, i) => {
    m.userData.phase += dt * 4;
    const a = (Math.sin(m.userData.phase) * 0.5 + 0.5) * 0.7;
    m.material.opacity = a * shine;
    m.lookAt(camera.position);
  });

  // Sampling
  sampleAccum += dt;
  if (sampleAccum > 0.18) {
    sampleAccum = 0;
    game.cleanliness = measureCleanliness();
    ui.clean.textContent = Math.round(game.cleanliness * 100) + '%';
    ui.bar.style.width = (game.cleanliness * 100).toFixed(0) + '%';
    if (!game.finished && game.cleanliness > 0.97 && foam.states.filter(Boolean).length < 6 && game.dryness > 0.7) {
      finishLevel();
    }
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

// ============================================================
//  Boot
// ============================================================
resize();
newLevel();
requestAnimationFrame(loop);
</script>
